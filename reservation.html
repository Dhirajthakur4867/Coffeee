<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Haven | Reservation</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>


@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


body{
    background:#f8f8f8;
}



/* Navbar */


.navbar{

    background:#000;
    padding:15px;

}


.navbar-brand{

    font-size:28px;
    font-weight:700;

}


.nav-link{

    color:white!important;
    margin-left:15px;

}


.nav-link:hover{

    color:#ffc107!important;

}





/* Hero */


.reservation-header{

height:60vh;

background:url('coffeebanner.jpg');

background-size:cover;

background-position:center;

display:flex;

justify-content:center;

align-items:center;

position:relative;

}



.reservation-header::before{

content:"";

position:absolute;

width:100%;

height:100%;

background:rgba(0,0,0,.6);

}



.header-content{

position:relative;

color:white;

text-align:center;

}



.header-content h1{

font-size:65px;

font-weight:800;

}



.header-content p{

font-size:22px;

}





/* Reservation Form */


.reservation-section{

padding:80px 0;

}



.form-box{

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}



.form-box h2{

text-align:center;

color:#6f4e37;

font-weight:700;

margin-bottom:30px;

}



.form-control,
.form-select{

padding:14px;

border-radius:12px;

}



.btn-custom{

background:#6f4e37;

color:white;

padding:14px 35px;

border-radius:50px;

font-size:18px;

}



.btn-custom:hover{

background:#4b2e1f;

color:white;

}





/* Contact Info */


.info-box{

background:#6f4e37;

color:white;

padding:30px;

border-radius:20px;

height:100%;

}



.info-box h3{

font-weight:700;

}



.info-box p{

font-size:17px;

line-height:2;

}




footer{

background:#000;

color:white;

padding:20px;

text-align:center;

}




</style>


</head>


<body>




<!-- Navbar -->


<nav class="navbar navbar-expand-lg navbar-dark fixed-top">


<div class="container">


<a class="navbar-brand" href="index.html">
☕ Coffee Haven
</a>



<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#nav">


<span class="navbar-toggler-icon"></span>


</button>




<div class="collapse navbar-collapse" id="nav">


<ul class="navbar-nav ms-auto">


<li class="nav-item">

<a class="nav-link" href="index.html">
Home
</a>

</li>


<li class="nav-item">

<a class="nav-link" href="menu.html">
Menu
</a>

</li>



<li class="nav-item">

<a class="nav-link active" href="reservation.html">
Reservation
</a>

</li>



</ul>


</div>


</div>


</nav>






<!-- Header -->


<section class="reservation-header">


<div class="header-content">


<h1>Book Your Table</h1>

<p>Enjoy your perfect coffee moment with us</p>


</div>


</section>







<!-- Reservation -->


<section class="reservation-section">


<div class="container">


<div class="row g-4 align-items-center">



<div class="col-md-7">


<div class="form-box">


<h2>
Table Reservation
</h2>



<form>



<div class="row">


<div class="col-md-6 mb-3">


<input type="text"
class="form-control"
placeholder="Your Name"
required>


</div>




<div class="col-md-6 mb-3">


<input type="email"
class="form-control"
placeholder="Your Email"
required>


</div>



</div>





<div class="row">


<div class="col-md-6 mb-3">


<input type="number"
class="form-control"
placeholder="Phone Number"
required>


</div>




<div class="col-md-6 mb-3">


<select class="form-select">


<option>
Number of Guests
</option>


<option>
1 Person
</option>


<option>
2 Persons
</option>


<option>
4 Persons
</option>


<option>
6 Persons
</option>


<option>
10 Persons
</option>


</select>


</div>


</div>







<div class="row">


<div class="col-md-6 mb-3">


<input type="date"
class="form-control">


</div>




<div class="col-md-6 mb-3">


<input type="time"
class="form-control">


</div>



</div>






<textarea rows="4"
class="form-control mb-3"
placeholder="Special Request">

</textarea>





<button class="btn btn-custom w-100">

Confirm Reservation

</button>



</form>



</div>


</div>







<div class="col-md-5">


<div class="info-box">


<h3>
Coffee Haven
</h3>


<p>
📍 New Delhi, India
</p>


<p>
☎ Phone: 9560517912
</p>


<p>
✉ Email: coffeehaven@gmail.com
</p>


<p>
⏰ Opening Hours:
<br>
8:00 AM - 11:00 PM
</p>



</div>


</div>




</div>


</div>


</section>


<footer>
Designed By Dhiraj Kumar

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
